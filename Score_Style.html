<style>
    body{
      font-family:Segoe UI,Arial;
      background:#cfedfa;
      margin:0;
      padding:10px 20px 70px;
    }
    .topbar{
      margin-bottom:20px;
    }
    button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#1565c0;
      color:#fff;
      font-size:22px;
      cursor:pointer;
    }
    .card{
      background:white;
      border-radius:12px;
      padding:18px;
      margin-bottom:15px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
      width:100%;
      box-sizing:border-box;
    }
    h2{
      color:#1565c0;
      text-align:center;
      font-size:40px;
      margin:0px 10px 10px;
    }
    label{
      display:block;
      font-size:24px;
      font-weight:bold;
      margin-top:10px;
      margin-bottom:5px;
    }
    select{
      width:100%;
      padding:12px;
      font-size:20px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-bottom:15px;
    }
    .stat{
      margin:8px 0;
      font-size:24px;
      font-weight:600;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:white;
    }
    thead th{
      position:sticky;
      top:0;
      background:#1565c0;
      color:white;
      z-index:100;
    }
    th{
      background:#1565c0;
      color:white;
      font-size:22px;
    }
    th,td{
      border:1px solid #ddd;
      padding:12px;
      text-align:left;
      font-size:20px;
    }
    tr:nth-child(even){
      background:#f7f7f7;
    }
    .diem{
      text-align:center;
      font-weight:bold;
    }
    .dashboard{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:40px;
      width:100%;
      box-sizing:border-box;
    }
    .leftPanel{
      width:30%;
      flex-shrink:0;
      display:grid;
      flex-direction:column;
      justify-content:center;
      align-self:center;
    }
    .rightPanel{
      width:70%;
      flex:1;
      min-width:0;
      display:grid;
    }
    #scoreChart{
      margin-top:20px;
      max-height:350px;
      width:100%;
      height:300px !important;
    }
    @media(max-width:768px){
      .dashboard{
        flex-direction:column;
      }
      .leftPanel{
        width:100%;
      }
    }
  </style>
